<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Address - OneBankKheawStore</title>
    <meta
      name="description"
      content="Add a new delivery address for your OneBankKheawStore order."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/checkout-add-address.css" />
    <script src="components/components.js"></script>
  </head>
  <body>
    <nav-bar></nav-bar>

    <div class="content-area">
      <!-- Destination for Delivery -->
      <div class="destination-section">
        <div class="section-label">Destination for Delivery</div>
        <div class="destination-row">
          <div class="destination-info">
            <strong>Daranpop (+66) XX XXX XXXX</strong>&nbsp;&nbsp;&nbsp; 100
            moo 29,Sub-district ,District ,province ,Thailand, Postcode
          </div>
          <span class="change-link">Change</span>
        </div>
      </div>

      <!-- Cart Items Review -->
      <div class="cart-table">
        <div class="cart-header">
          <span>Product</span>
          <span>Price</span>
          <span>Quantity</span>
          <span>Total</span>
        </div>
        <div class="cart-item">
          <div class="product-info">
            <div class="product-image">
              <img
                src="https://i.ibb.co/PZSZKk1r/d1cd663a4bd97995049b4eee2a5bcbd77163146a.jpg"
                alt="Minimalist Storage Box"
              />
            </div>
            <div class="product-details">
              <div class="product-category">Home Organization</div>
              <div class="product-name">Minimalist Storage Box</div>
              <div class="product-variant">Size: Small • White</div>
            </div>
          </div>
          <div class="item-price">20</div>
          <div class="quantity-selector">
            <button class="qty-btn minus">
              <span class="material-icons-outlined" style="font-size: 14px"
                >remove</span
              >
            </button>
            <div class="qty-value">2</div>
            <button class="qty-btn plus">
              <span class="material-icons-outlined" style="font-size: 14px"
                >add</span
              >
            </button>
          </div>
          <div class="item-total-wrap">
            <span class="item-total">40฿</span>
            <button class="remove-btn">
              <span class="material-icons-outlined">delete_outline</span>
            </button>
          </div>
        </div>
      </div>
      <a href="index.html" class="continue-shopping"
        ><span>←</span> Continue Shopping</a
      >
    </div>

    <!-- ====== MODAL: New Address Form ====== -->
    <div class="modal-overlay" id="add-address-modal">
      <div class="modal-box">
        <div class="modal-title">New Adress</div>

        <form id="address-form">
          <div class="form-row">
            <input
              type="text"
              class="form-input"
              id="fullname-input"
              placeholder="Fullname"
              required
            />
            <input
              type="tel"
              class="form-input"
              id="phone-input"
              placeholder="Phone No."
              required
            />
          </div>

          <textarea
            class="form-textarea"
            id="address-input"
            placeholder="Full Address"
            required
          ></textarea>

          <div class="type-label">Type</div>
          <div class="type-options">
            <button type="button" class="type-btn active" id="type-home-btn">
              Home
            </button>
            <button type="button" class="type-btn" id="type-office-btn">
              Office
            </button>
          </div>

          <div class="form-actions">
            <a href="checkout-change-address.html">
              <button type="button" class="cancel-btn" id="cancel-btn">
                Cancel
              </button>
            </a>
            <a href="checkout-success.html">
              <button type="submit" class="submit-btn" id="submit-btn">
                Submit
            </button>
            </a>
          </div>
        </form>
      </div>
    </div>

    <footer-bar></footer-bar>

    <script>
      // Toggle Home/Office type buttons
      const homeBtn = document.getElementById("type-home-btn");
      const officeBtn = document.getElementById("type-office-btn");

      homeBtn.addEventListener("click", () => {
        homeBtn.classList.add("active");
        officeBtn.classList.remove("active");
      });

      officeBtn.addEventListener("click", () => {
        officeBtn.classList.add("active");
        homeBtn.classList.remove("active");
      });
    </script>
    <script src="js/config.js" defer></script>
    <script src="js/nav-search.js" defer></script>
  </body>
</html>
