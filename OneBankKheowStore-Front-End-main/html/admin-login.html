<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - OneBankKheawStore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/admin-login.css" />
    <script src="components/components.js"></script>
  </head>
  <body>
    <nav-bar></nav-bar>

    <main class="admin-login-container">
      <div class="login-card">
        <div class="login-left">
          <h1 class="login-title">Admin Login</h1>
          <div class="divider"></div>
          <form class="login-form">
            <div class="form-group">
              <input
                type="text"
                placeholder="Username/Email"
                id="Username"
                required
                title="Please fill username or email address."
              />
            </div>
            <div class="form-group">
              <input
                type="password"
                placeholder="Password"
                id="password"
                required
              />
            </div>
            <button type="submit" class="btn-login">Login</button>
          </form>
        </div>
        <div class="login-right">
          <img
            src="https://i.ibb.co/4RJ3S6Jp/login-admin.jpg"
            alt="Login Graphic"
          />
        </div>
      </div>
    </main>
    <script src="js/config.js" defer></script>
    <script src="js/admin-login.js" defer></script>
  </body>
</html>
