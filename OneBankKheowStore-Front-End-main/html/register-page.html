<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Login OneBankKheow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/login-register.css" />
  </head>
  <body>
    <div class="left">
      <div class="brand">
        <span class="brand-name">Gets Started Shopping Now</span>
      </div>
      <p class="tagline">
        Shopping Start by your Interested, And Make it to Happiness.
      </p>

      <form action="index.html">
        <div class="form-group">
          <label for="email">User/Email</label>
          <input
            id="email"
            type="email"
            placeholder="Example@gmail.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            id="password"
            type="password"
            placeholder="At least 8 characters"
            required
          />
        </div>

        <div class="row-checkbox">
          <label class="checkbox-label">
            <input type="checkbox" class="checkbox" />
            Keep Me Logged In
          </label>
        </div>

        <button type="submit" class="btn-login">Sign up</button>
      </form>

      <div class="divider">Or</div>

      <a href="#" class="social-btn">
        <img
          src="https://www.svgrepo.com/show/475656/google-color.svg"
          alt="Google"
        />
        Sign in with Google
      </a>

      <a href="#" class="social-btn">
        <img
          src="https://www.svgrepo.com/show/475647/facebook-color.svg"
          alt="Facebook"
        />
        Sign in with Facebook
      </a>

      <div class="signup-row">
        Do you have an account? <a href="login-page.html">Log in</a>
      </div>

      <footer class="footer-copy">
        © 2026 OneBankKheow Inc. All rights reserved.
      </footer>
    </div>

    <!-- RIGHT: Image -->
    <div class="right">
      <img
        src="/picture/arttower-ai-generated-8813036_1280.jpg"
        alt="Sign up image"
      />
    </div>
  </body>
</html>
