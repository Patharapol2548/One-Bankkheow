<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Login OneBankKheow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/login-register.css" />
  </head>
  <body>
    <div class="left">
      <div class="brand">
        <span class="brand-name">One BankKheow 👋</span>
      </div>
      <p class="tagline">
        Shopping is a Happiness, at the same price 20 baht each.
      </p>

      <form>
        <div class="form-group">
          <label for="email">User/Email</label>
          <input
            id="email"
            type="email"
            placeholder="Example@gmail.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            id="password"
            type="password"
            placeholder="At least 8 characters"
            required
          />
        </div>

        <div class="row-forgot">
          <a href="#" class="forgot">Forgot Password?</a>
        </div>

        <button type="submit" class="btn-login">Log in</button>
      </form>

      <div class="divider">Or</div>

      <a href="#" class="social-btn">
        <img
          src="https://www.svgrepo.com/show/475656/google-color.svg"
          alt="Google"
        />
        Sign in with Google
      </a>

      <a href="#" class="social-btn">
        <img
          src="https://www.svgrepo.com/show/475647/facebook-color.svg"
          alt="Facebook"
        />
        Sign in with Facebook
      </a>

      <div class="signup-row">
        Don't have an account? <a href="register-page.html">Sign up</a>
      </div>

      <footer class="footer-copy">
        © 2026 OneBankKheow Inc. All rights reserved.
      </footer>
    </div>

    <!-- RIGHT: Image -->
    <div class="right">
      <img src="https://i.ibb.co/39NfCqDq/2-1.jpg" alt="login image" />
    </div>
    <script src="js/config.js" defer></script>
    <script src="js/login.js" defer></script>
  </body>
</html>
