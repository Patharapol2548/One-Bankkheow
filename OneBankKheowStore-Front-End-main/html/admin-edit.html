<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Edit Item - OneBankKheawStore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/admin-edit.css" />
    <script src="components/components.js"></script>
  </head>
  <body>
    <header class="admin-nav">
        <div class="logo">
            <a href="index.html">
                <img src="https://i.ibb.co/DgPkg1vR/onebkeow.png" alt="Logo">
            </a>
        </div>
        <div class="search-container">
            <form class="search-bar">
                <img src="https://img.icons8.com/?size=100&id=p8VkXMjDOpcE&format=png&color=000000" alt="Search Icon" style="width: 30px; height: 30px;">
                <input type="text" placeholder="Search Tools or Item.." required>
            </form>
        </div>
        <div class="admin-header-text">
            Hi Admin ! // ADMIN CONSOLE
        </div>
    </header>

    <main class="page-container">
      <div class="main-edit-container">
        <!-- Left Column: Images & Spinners -->
        <div class="left-col">
          <img
            src="https://blocks.astratic.com/img/general-img-square.png"
            alt="Main Item Image"
            class="main-img"
          />

          <div class="thumbnail-row">
            <img
              src="https://blocks.astratic.com/img/general-img-square.png"
              alt="Thumb 1"
              class="thumbnail"
            />
            <img
              src="https://blocks.astratic.com/img/general-img-square.png"
              alt="Thumb 2"
              class="thumbnail"
            />
            <img
              src="https://blocks.astratic.com/img/general-img-square.png"
              alt="Thumb 3"
              class="thumbnail"
            />
            <div class="add-thumbnail">
              <img
                src="https://i.ibb.co/5g8H8G7f/icons8-add-100.png"
                alt="Add Image"
              />
            </div>
          </div>

          <div class="controls-row">
            <div class="control-group">
              <label class="control-label">Amount</label>
              <div class="spinner">
                <div class="spinner-btn">-</div>
                <div class="spinner-val">10</div>
                <div class="spinner-btn">+</div>
              </div>
            </div>
            <div class="control-group">
              <label class="control-label">Promotion(%)</label>
              <div class="spinner">
                <div class="spinner-btn">-</div>
                <div class="spinner-val">0</div>
                <div class="spinner-btn">+</div>
              </div>
            </div>
          </div>
        </div>

        <!-- Right Column: Form Fields -->
        <form class="right-col">
          <div class="form-group">
            <label class="form-label">Name</label>
            <input type="text" class="form-input" />
          </div>
          <div class="form-group">
            <label class="form-label">Brand</label>
            <input type="text" class="form-input" />
          </div>
          <div class="form-group">
            <label class="form-label">ID</label>
            <input type="text" class="form-input" />
          </div>
          <div class="form-group">
            <label class="form-label">Description</label>
            <textarea class="form-textarea" required></textarea>
          </div>

          <div class="actions-row">
            <a href="admin.html" class="btn-cancel">Cancel</a>
            <button type="submit" class="btn-submit">Submit</button>
          </div>
        </form>
      </div>
    </main>
    <script src="js/config.js" defer></script>
    <script src="js/admin-edit.js" defer></script>
  </body>
</html>
